# =============================================================================
# NexCreate - Docker Compose Configuration
# Complete stack: Laravel + Nginx + MySQL + Redis
# =============================================================================

services:
  # =========================================================================
  # PHP-FPM Application Service
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexcreate-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - backend_network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}

  # =========================================================================
  # Nginx Web Server
  # =========================================================================
  nginx:
    image: nginx:stable-alpine
    container_name: nexcreate-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend_network
    depends_on:
      - app

  # =========================================================================
  # MySQL Database
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: nexcreate-mysql
    restart: unless-stopped
    ports:
      # Bound to localhost only: never expose the DB to the network.
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-nexcreate}
      MYSQL_USER: ${DB_USERNAME:-nexcreate_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_network
    command: --default-authentication-plugin=mysql_native_password

  # =========================================================================
  # Redis Cache & Session Store
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: nexcreate-redis
    restart: unless-stopped
    ports:
      # Bound to localhost only: never expose Redis to the network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    command: redis-server --appendonly yes

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  backend_network:
    driver: bridge
